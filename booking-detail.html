<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الحجز - وكالة الدواحي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-light lang-ar" id="pageBody">

<div class="navbar">
  <div class="brand">وكالة الدواحي ✦ <span>للسفر والسياحة</span></div>
  <div class="nav-links">
    <a href="my-bookings.html">حجوزاتي</a>
    <a href="home.html">شركات الطيران</a>
    <span style="color:var(--sand)" id="navUsername">...</span>
    <a href="#" class="btn small danger" onclick="doLogout(); return false;">خروج</a>
    <span class="nav-controls">
      <button type="button" class="theme-btn" onclick="setTheme('light')">☀️</button>
      <button type="button" class="theme-btn" onclick="setTheme('dark')">🌙</button>
    </span>
  </div>
</div>

<div class="wrap">
  <h1>تفاصيل الحجز</h1>
  
  <div class="card" id="detailCard" style="max-width:600px; margin:40px auto;">
    <p>جارٍ التحميل...</p>
  </div>
  
  <div class="center" style="margin-top:20px">
    <a href="my-bookings.html" class="btn">العودة إلى الحجوزات</a>
  </div>
</div>

<div class="footer-note">وكالة الدواحي للسفر والسياحة — رحلتك تبدأ من هنا</div>

<script src="theme.js"></script>
<script>
fetch('/api/session').then(r => r.json()).then(d => {
  if (!d.logged_in) { window.location.href = 'login.html'; return; }
  const el = document.getElementById('navUsername');
  if (el) el.textContent = d.username;
});

function doLogout() {
  fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = 'login.html'; });
}

const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

if (!code) {
  document.getElementById('detailCard').innerHTML = '<p>لم يتم تحديد رمز الحجز</p>';
} else {
  fetch('/api/booking/' + encodeURIComponent(code))
    .then(r => r.json())
    .then(data => {
      const card = document.getElementById('detailCard');
      if (!data.ok) {
        card.innerHTML = '<p style="color:var(--danger)">' + (data.error || 'لم يتم العثور على الحجز') + '</p>';
        return;
      }
      const b = data.booking;
      const statusClass = b.status === 'ملغاة' ? 'cancel' : 'ok';
      
      card.innerHTML = `
        <div style="border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px;">
          <h3>${b.title}</h3>
          <div class="subtitle">${b.kind === 'hotel' ? '🏨 فندق' : '✈️ رحلة جوية'}</div>
        </div>
        
        <div style="margin-bottom:12px;">
          <div style="color:var(--muted); font-size:0.85rem;">رمز الحجز</div>
          <div style="font-weight:bold; font-size:1.1rem; color:var(--gold-soft)">${b.code}</div>
        </div>
        
        <div style="margin-bottom:12px;">
          <div style="color:var(--muted); font-size:0.85rem;">السعر</div>
          <div style="font-weight:bold; font-size:1.1rem; color:var(--ok)">${b.price.toLocaleString('en-US')} ج.س</div>
        </div>
        
        <div style="margin-bottom:12px;">
          <div style="color:var(--muted); font-size:0.85rem;">الحالة</div>
          <div><span class="badge ${statusClass}">${b.status}</span></div>
        </div>
        
        <div style="margin-bottom:12px;">
          <div style="color:var(--muted); font-size:0.85rem;">التفاصيل</div>
          <div style="font-size:0.95rem;">${b.details || '-'}</div>
        </div>
        
        <div style="margin-bottom:12px;">
          <div style="color:var(--muted); font-size:0.85rem;">تاريخ الحجز</div>
          <div style="font-size:0.95rem;">${new Date(b.created_at).toLocaleString('ar-SA')}</div>
        </div>
        
        ${b.status !== 'ملغاة' ? `
          <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
            <button class="btn danger" style="width:100%" onclick="cancelBooking('${b.code}')">إلغاء الحجز</button>
          </div>
        ` : ''}
      `;
    })
    .catch(err => {
      document.getElementById('detailCard').innerHTML = '<p style="color:var(--danger)">تعذر الاتصال بالسيرفر</p>';
    });
}

function cancelBooking(code) {
  if (!confirm('هل أنت متأكد من إلغاء الحجز؟')) return;
  fetch('/api/booking/' + encodeURIComponent(code) + '/cancel', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      if (!data.ok) {
        alert(data.error || 'تعذر الإلغاء');
        return;
      }
      alert('تم إلغاء الحجز بنجاح');
      window.location.href = 'my-bookings.html';
    })
    .catch(() => {
      alert('تعذر الاتصال بالسيرفر');
    });
}
</script>

</body>
</html>
